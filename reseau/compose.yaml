services:
  # Gluetun (Le Bouclier VPN)
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - multimedia_net
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=${VPN_FOURNISSEUR}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${VPN_CLE_PRIVEE}
      - SERVER_COUNTRIES=${VPN_PAYS}
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24
      - VPN_PORT_FORWARDING=on
    volumes:
      - ${CHEMIN_RELATIF_CONFIG}/gluetun:/gluetun
    ports:
      # --- PORTS DES APPLICATIONS CACHÉES DERRIÈRE LE VPN ---
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
      - 9696:9696
    restart: unless-stopped

networks:
  multimedia_net:
    external: true
